<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matematik Savaşları: Klasik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #1a1a1a;
            user-select: none;
        }

        .game-font {
            font-family: 'Fredoka One', cursive;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        .btn-game {
            transition: transform 0.05s, filter 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-game:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        .glass-panel {
            background: rgba(40, 30, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #8b4513;
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            color: #e2e8f0;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .btn-fire-ready {
            animation: pulse-red 1.5s infinite;
        }

        /* Flashing timer */
        .timer-warning {
            color: #ef4444 !important;
            animation: pulse-text 0.5s infinite alternate;
        }

        @keyframes pulse-text {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body class="bg-gray-900">

    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="p-2 select-none">

        <!-- Top HUD -->
        <div class="flex flex-col w-full pointer-events-none z-10 gap-2">
            <div class="flex justify-between items-center w-full px-2">
                <div class="flex gap-2 pointer-events-auto">
                    <a href="/"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-lg border border-indigo-400 text-xs font-bold shadow-lg transition-colors flex items-center gap-1"

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- AUDIO MANAGER ---
        const AudioSys = {
            ctx: null,
            init: function () {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playTone: function (freq, type, duration, vol = 0.1) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            playJump: function () { this.playTone(200, "triangle", 0.1, 0.1); },
            playShoot: function () { this.playTone(600, "sawtooth", 0.3, 0.1); },
            playExplosion: function () { this.playTone(80, "square", 0.5, 0.3); },
            playSplash: function () { this.playTone(150, "sine", 0.4, 0.2); },
            playCharge: function (val) { this.playTone(200 + val * 5, "sine", 0.05, 0.05); },
            playTick: function () { this.playTone(800, "square", 0.05, 0.05); }
        };

        // --- CONFIG ---
        let width, height;

        let gameState = "MENU";
        let currentPlayer = 0;
        let totalPlayers = 2;
        let terrainY = [];
        let terrainTexture = [];
        let waterLevel = 0;
        let wind = 0;
        let projectiles = [];
        let explosions = [];
        let particles = [];

        let power = 0;
        let powerDir = 1.5;

        const teamConfigs = [
            { name: "MAVİ", color: "#60a5fa", body: "#3b82f6", outline: "#1e3a8a", bg: "bg-blue-600" },

            { name: "YEŞİL", color: "#4ade80", body: "#22c55e", outline: "#14532d", bg: "bg-green-600" },
            { name: "MOR", color: "#c084fc", body: "#a855f7", outline: "#581c87", bg: "bg-purple-600" }

        let teams = [];

        // --- COMMENTS ---
        const comments = {
            start: ["Hazır mısınız?", "Savaş başlasın!", "Mağaraya hoşgeldiniz!"],
            hit: ["Tam isabet!", "Bum!", "Fena vurdu!", "Hesap tuttu!"],
            miss: ["Karavana!", "Rüzgarı unuttun!", "Karanlıkta göremedi!", "Iskaladı!"],

            win: ["Şampiyon belli!", "Zafer!", "Oyun bitti!"],
            draw: ["Dostluk kazandı!", "Berabere!", "İkisi de gitti!"]
        };

        function showComment(type) {
            const list = comments[type] || comments['miss'];
            const text = list[Math.floor(Math.random() * list.length)];
            const el = document.getElementById('commentary');
            document.getElementById('comment-text').innerText = text;
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, 3000);
        }

        // --- MENU STATE ---
        let selectedGrade = null;
        let selectedTopic = null;

        // TOPICS PER GRADE
        const gradeTopics = {
            5: ["Doğal Sayılar", "Kesirler", "Geometrik Şekiller", "Çevre ve Alan"],
            6: ["Tam Sayılar", "Kesirler", "Oran-Orantı", "Denklem", "Açılar", "Hacim"],
            7: ["Rasyonel Sayılar", "Cebirsel İfadeler", "Denklemler", "Oran ve Orantı", "Yüzdeler", "Dörtgenler", "Çember ve Daire"],
            8: ["Üslü İfadeler", "Kareköklü İfadeler", "Özdeşlikler", "Çarpanlara Ayırma", "Olasılık", "Denklemler", "Üçgenler", "Eşitsizlikler"]
        };

        // MENU FUNCTIONS
        function selectGrade(grade) {
            selectedGrade = grade;
            document.getElementById('grade-selection').classList.add('hidden');
            document.getElementById('topic-selection').classList.remove('hidden');
            document.getElementById('selected-grade-text').innerText = grade + '. Sınıf';

            const container = document.getElementById('topic-buttons');
            container.innerHTML = '';
            gradeTopics[grade].forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'btn-game bg-teal-600 hover:bg-teal-500 text-white text-lg font-bold py-3 px-6 rounded-xl border-b-4 border-teal-800 transition-all hover:scale-105';
                btn.innerText = topic;
                btn.onclick = () => selectTopic(topic);
                container.appendChild(btn);
            });
        }

        function selectTopic(topic) {
            selectedTopic = topic;
            document.getElementById('topic-selection').classList.add('hidden');
            document.getElementById('player-selection').classList.remove('hidden');
            document.getElementById('selected-topic-text').innerText = selectedGrade + '. Sınıf - ' + topic;
        }

        function backToGrade() {
            document.getElementById('topic-selection').classList.add('hidden');
            document.getElementById('grade-selection').classList.remove('hidden');
        }

        function backToTopic() {
            document.getElementById('player-selection').classList.add('hidden');
            document.getElementById('topic-selection').classList.remove('hidden');
        }

        function startGameWithPlayers(count) {
            totalPlayers = count;
            document.getElementById('start-screen').style.display = 'none';
            startGame(count);
        }

                ],

            6: {
                "Tam Sayılar": [
                    { q: "(-5) + 3 = ?", a: "-2", d: ["2", "-8", "8"] },

        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

                    const ans = fn(a, b);
                    return { q: `${a} ${op} ${b} = ?`, a: String(ans), d: [String(ans + rand(1, 5)), String(ans - rand(1, 5)), String(ans + rand(-10, 10))] };

        function generateQuestion() {
            const bank = questionBanks[selectedGrade]?.[selectedTopic];
            const generator = dynamicGenerators[selectedGrade]?.[selectedTopic];

            // %50 statik, %50 dinamik (eğer her ikisi de varsa)
            const useDynamic = generator && (Math.random() > 0.5 || !bank || usedQuestions.size >= bank.length);

            if (useDynamic && generator) {
                const qData = generator();
                return {
                    q: qData.q,
                    a: qData.a,
                    options: [qData.a, ...qData.d].sort(() => Math.random() - 0.5)
                };
            }

            // Statik bankadan çek
            const finalBank = bank || questionBanks[8]["Özdeşlikler"];

            if (usedQuestions.size >= finalBank.length) {
                usedQuestions.clear();
            }

            let idx;
            do {
                idx = Math.floor(Math.random() * finalBank.length);
            } while (usedQuestions.has(idx));

            usedQuestions.add(idx);

            const qData = finalBank[idx];
            return {
                q: qData.q,
                a: qData.a,
                options: [qData.a, ...qData.d].sort(() => Math.random() - 0.5)
            };
        }

        // --- ENTITIES ---
        class Worm {
            constructor(x, teamIdx) {
                this.x = x; this.team = teamIdx;
                this.radius = 12;
                this.y = getTerrainHeight(x) - this.radius;
                this.angle = 0;
                this.aimAngle = -Math.PI / 4;
                this.health = 100; this.dead = false;
                this.vx = 0; this.vy = 0; this.animTimer = 0;

                if (x > width / 2) this.flip();
            }

            flip() {
                if (this.angle === 0) {
                    this.angle = Math.PI;
                    this.aimAngle = -Math.PI - this.aimAngle;
                } else {
                    this.angle = 0;
                    this.aimAngle = -Math.PI - this.aimAngle;
                }
            }

            setFacing(dir) {
                if (dir > 0 && this.angle !== 0) this.flip();
                if (dir < 0 && this.angle === 0) this.flip();
            }

            update() {
                if (this.dead) return;

                this.vy += 0.3;

                let nextX = this.x + this.vx;
                let nextY = getTerrainHeight(nextX);
                let currY = getTerrainHeight(this.x);
                let slope = currY - nextY;

                if (this.grounded && slope > 12) {
                    this.vx = 0;
                } else {
                    this.x += this.vx;
                }

                this.y += this.vy;
                this.vx *= 0.85;

                let ty = getTerrainHeight(this.x);
                if (this.y + 10 > ty) {
                    this.y = ty - 10;
                    this.vy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }

                this.animTimer++;

                if (this.y > waterLevel + 10) {
                    this.health = 0; this.dead = true;
                    createSplash(this.x, this.y); AudioSys.playSplash(); showComment('water');
                    checkDeaths(); updateHUD(); checkGameOver();
                }
                if (this.x < 0) this.x = 0; if (this.x > width) this.x = width;
            }

            draw() {
                if (this.dead) return;
                ctx.save(); ctx.translate(this.x, this.y);
                const teamData = teams[this.team];

                if (gameState !== 'FIRE_ANIM') {
                    ctx.fillStyle = teamData.color; ctx.font = "bold 11px Nunito"; ctx.textAlign = "center";
                    ctx.shadowColor = "black"; ctx.shadowBlur = 2;
                    ctx.fillText(this.health + "%", 0, -35); ctx.shadowBlur = 0;
                }

                const lookDir = Math.cos(this.angle) > 0 ? 1 : -1;
                ctx.fillStyle = teamData.body; ctx.strokeStyle = teamData.outline; ctx.lineWidth = 1.5;
                let breath = Math.sin(this.animTimer * 0.1);

                for (let i = 0; i < 4; i++) {
                    let ox = i === 0 ? -5 * lookDir : (i === 1 ? 0 : (i === 2 ? 2 * lookDir : 4 * lookDir));
                    let oy = i === 0 ? 5 : (i === 1 ? 0 : (i === 2 ? -8 : -16));
                    let rad = i === 3 ? 9 : (i === 0 ? 6 : (i === 1 ? 7 : 8));
                    ctx.beginPath(); ctx.arc(ox, oy + breath, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc((4 * lookDir) + (3 * lookDir), -18 + breath, 3.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc((4 * lookDir) + (7 * lookDir), -18 + breath, 3.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc((4 * lookDir) + (4 * lookDir), -18 + breath, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc((4 * lookDir) + (8 * lookDir), -18 + breath, 1.5, 0, Math.PI * 2); ctx.fill();

                if (teams[currentPlayer].worms.includes(this)) {
                    ctx.fillStyle = this.team === 0 ? "#2563eb" : (this.team === 1 ? "#dc2626" : (this.team === 2 ? "#15803d" : "#7e22ce"));
                    ctx.fillRect((4 * lookDir) - 6, -24 + breath, 12, 3);
                    ctx.fillRect((4 * lookDir) + (lookDir > 0 ? -6 : 4), -24 + breath, 2, 8);
                }

                if (teams[currentPlayer].worms.includes(this) && gameState !== "FIRE_ANIM") {
                    const hX = 4 * lookDir, hY = -16 + breath;
                    const ax = hX + Math.cos(this.aimAngle) * 70, ay = hY + Math.sin(this.aimAngle) * 70;
                    ctx.beginPath(); ctx.moveTo(hX, hY); ctx.lineTo(ax, ay);
                    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
                    ctx.strokeStyle = teamData.color; ctx.beginPath(); ctx.arc(ax, ay, 8, 0, Math.PI * 2);
                    ctx.moveTo(ax - 12, ay); ctx.lineTo(ax + 12, ay); ctx.moveTo(ax, ay - 12); ctx.lineTo(ax, ay + 12); ctx.stroke();
                }
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, force) {
                this.x = x; this.y = y; this.radius = 5;
                const speed = force * 20;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.active = true; this.timer = 0;
            }
            update() {
                if (!this.active) return;
                this.x += this.vx; this.y += this.vy; this.vy += 0.25; this.vx += wind * 0.005;
                this.timer++;
                if (this.timer % 3 === 0) particles.push({ x: this.x, y: this.y, vx: (Math.random() - 0.5), vy: (Math.random() - 0.5), life: 0.8, color: "gray", size: 3 });

                if (this.x < -100 || this.x > width + 100) { this.active = false; showComment('miss'); endTurnDelayed(1000); return; }

                // BUG FIX: Check collision with worms FIRST
                for (let t of teams) {
                    for (let w of t.worms) {
                        if (!w.dead && Math.hypot(w.x - this.x, w.y - this.y) < 25) {
                            explode(this.x, this.y, 50);
                            this.active = false;
                            return;
                        }
                    }
                }

                let ty = getTerrainHeight(this.x);
                if (this.y > waterLevel) { this.active = false; createSplash(this.x, this.y); AudioSys.playSplash(); showComment('water'); endTurnDelayed(1000); return; }

                if (this.y > ty) {
                    explode(this.x, this.y, 50);
                    this.active = false;
                    return;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.fillStyle = "#374151"; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(6, 0, 4, -Math.PI / 2, Math.PI / 2); ctx.fill();
                ctx.restore();
            }
        }

        // --- CORE FUNCTIONS ---
        function init() {
            window.addEventListener('resize', resize);
            setupControls();
            resize();
            requestAnimationFrame(loop);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            waterLevel = height - 40;
            if (gameState === "MENU") generateMap();
        }

        // --- MAP GENERATION (Single Screen) ---
        function generateMap() {
            terrainY = [];
            terrainTexture = [];

            const seed = Math.random() * 100;
            const freq1 = 0.01 + Math.random() * 0.01;
            const freq2 = 0.03 + Math.random() * 0.02;

            for (let x = 0; x <= width; x++) {
                let noise = (height * 0.5) +
                    Math.sin(x * freq1 + seed) * 100 +
                    Math.sin(x * freq2 - seed) * 50 +
                    Math.cos(x * 0.03) * 20;

                if (Math.sin(x * 0.02 + seed) > 0.7) noise += 80;
                if (Math.cos(x * 0.015 - seed) < -0.8) noise -= 60;
                noise += (Math.random() - 0.5) * 10;

                if (noise > waterLevel + 50) noise = waterLevel + 50;
                if (noise < 50) noise = 50;
                terrainY[x] = noise;
            }

            for (let k = 0; k < 2; k++) {
                for (let i = 1; i < width - 1; i++) {
                    terrainY[i] = (terrainY[i - 1] + terrainY[i] + terrainY[i + 1]) / 3;
                }
            }

            for (let sx = 0; sx < width; sx += 20) {
                let surfaceY = terrainY[Math.floor(sx)] || 0;
                for (let sy = surfaceY + 10; sy < height; sy += 25 + Math.random() * 15) {
                    let size = 2 + Math.random() * 4;
                    let offsetX = (Math.random() - 0.5) * 15;
                    let offsetY = (Math.random() - 0.5) * 15;
                    terrainTexture.push({
                        x: sx + offsetX,
                        y: sy + offsetY,
                        r: size
                    });
                }
            }
        }

        function getTerrainHeight(x) {
            let ix = Math.floor(x);
            if (ix < 0) ix = 0; if (ix >= width) ix = width - 1;
            return terrainY[ix] || height;
        }

        // --- SPAWN LOGIC (Distributed) ---
        function getSafeSpawnX(sectorIndex, totalSectors) {
            let safeWidth = width * 0.8;
            let startX = (width - safeWidth) / 2;
            let sectorSize = safeWidth / (totalSectors - 1);

            let targetX = startX + (sectorIndex * sectorSize);

            let bestX = targetX;
            let highestY = 9999;
            for (let x = targetX - 40; x < targetX + 40; x += 10) {
                if (x < 0 || x > width) continue;
                let y = getTerrainHeight(x);
                if (y < waterLevel - 60 && y < highestY) { highestY = y; bestX = x; }
            }
            return bestX;
        }

        function explode(x, y, radius) {
            explosions.push({ x, y, r: 0, maxR: radius });
            AudioSys.playExplosion();

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    life: 1.0 + Math.random() * 0.5,
                    color: Math.random() > 0.5 ? "#FFA500" : "#555",
                    size: 3 + Math.random() * 3
                });
            }

            let start = Math.floor(x - radius);
            let end = Math.floor(x + radius);

            for (let i = start; i <= end; i++) {
                if (i < 0 || i >= width) continue;
                let dx = i - x;
                let dy = Math.sqrt(radius * radius - dx * dx);
                let circleBottom = y + dy;

                if (terrainY[i] < circleBottom) {
                    terrainY[i] = Math.max(terrainY[i], circleBottom);
                }
            }

            terrainTexture = terrainTexture.filter(t => {
                let d = Math.hypot(t.x - x, t.y - y);
                return d > radius;
            });

            let hit = false;
            teams.forEach(t => t.worms.forEach(w => {
                let d = Math.hypot(w.x - x, w.y - y);
                if (d < radius + 30) {
                    hit = true;
                    let dmg = Math.floor((1 - d / (radius + 30)) * 80);
                    if (dmg < 5) dmg = 5;
                    w.health = Math.max(0, w.health - dmg);
                    floatTexts.push({ x: w.x, y: w.y - 30, text: "-" + dmg, life: 1.5, vy: -1 });

                    let ang = Math.atan2(w.y - y, w.x - x);
                    w.vx = Math.cos(ang) * 10;
                    w.vy = Math.sin(ang) * 10 - 5;
                    w.onGround = false;
                }
            }));

            checkDeaths(); updateHUD();
            if (hit) showComment('hit'); else showComment('miss');
            endTurnDelayed();
        }

        function createSplash(x, y) {
            for (let i = 0; i < 25; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 10, life: 1, color: "rgba(200,230,255,0.9)", size: 4 });
        }

        function startGame(players) {
            totalPlayers = players;
            document.getElementById('start-screen').style.display = 'none';
            generateMap();
            AudioSys.init();

            teams = [];
            let sectors = totalPlayers === 2 ? 2 : totalPlayers;

            for (let i = 0; i < totalPlayers; i++) {
                let conf = teamConfigs[i];
                let spawnX = getSafeSpawnX(i, totalPlayers);

                teams.push({
                    name: conf.name, color: conf.color, bodyColor: conf.body, outline: conf.outline,
                    bgClass: conf.bg, worms: [new Worm(spawnX, i)], health: 100
                });
            }

            setupHUD();
            currentPlayer = Math.floor(Math.random() * totalPlayers);
            newTurn();
        }

        function setupHUD() {
            const container = document.getElementById('health-bars-container');
            container.innerHTML = '';
            teams.forEach((t, i) => {
                let div = document.createElement('div');
                div.className = "flex flex-col items-center";
                div.innerHTML = `
                    <div class="bg-gray-800/90 border-2 text-white px-2 py-1 rounded-lg shadow-lg flex flex-col items-center min-w-[70px]" style="border-color:${t.color}">
                        <span class="text-[10px] font-bold" style="color:${t.color}">${t.name}</span>
                        <span id="p${i}-health" class="text-lg game-font">100</span>
                    </div>
                    <div class="w-16 md:w-20 h-3 bg-gray-800 border border-gray-600 rounded-full mt-1 overflow-hidden">
                        <div id="p${i}-bar" class="h-full w-full transition-all duration-300 ${t.bgClass}"></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateHUD() {
            teams.forEach((t, i) => {
                document.getElementById(`p${i}-health`).innerText = t.health;
                document.getElementById(`p${i}-bar`).style.width = Math.min(100, t.health) + "%";
            });
        }

        function goToMenu() {
            gameState = "MENU";
            clearInterval(turnInterval);
            document.getElementById('start-screen').style.display = 'flex';
            // Reset to grade selection
            document.getElementById('grade-selection').classList.remove('hidden');
            document.getElementById('topic-selection').classList.add('hidden');
            document.getElementById('player-selection').classList.add('hidden');
            document.getElementById('message-area').classList.add('hidden');
            document.getElementById('game-over-controls').classList.add('hidden');
            document.getElementById('math-modal').classList.add('hidden');
            document.getElementById('btn-quiz').classList.remove('hidden');
            document.getElementById('btn-fire').classList.add('hidden');

            projectiles = []; explosions = []; particles = []; floatTexts = [];
            usedQuestions.clear();
            teams.forEach(t => { t.worms = []; t.health = 100; });
        }

        function newTurn() {
            if (checkGameOver()) return;
            turnChangePending = false;

            let loopCount = 0;
            do {
                currentPlayer = (currentPlayer + 1) % totalPlayers;
                loopCount++;
            } while (teams[currentPlayer].health <= 0 && loopCount < totalPlayers + 1);

            gameState = "PLAYING";
            wind = Math.floor((Math.random() * 20) - 10);
            document.getElementById('wind-text').innerText = Math.abs(wind);
            let icon = document.getElementById('wind-icon');
            icon.className = wind > 0 ? "fas fa-arrow-right text-blue-400" : (wind < 0 ? "fas fa-arrow-left text-red-400" : "fas fa-minus");

            resetActionButtons();

            turnTimer = 45;
            const tEl = document.getElementById('turn-timer');
            tEl.innerText = turnTimer;
            tEl.classList.remove('timer-warning');

            clearInterval(turnInterval);
            turnInterval = setInterval(() => {
                if (gameState === "PLAYING" || gameState === "AIMING") {
                    turnTimer--;
                    tEl.innerText = turnTimer;
                    if (turnTimer <= 5) {
                        tEl.classList.add('timer-warning');
                        AudioSys.playTick();
                    }
                    if (turnTimer <= 0) { showMessage("SÜRE BİTTİ!", "orange"); endTurnDelayed(1000); }
                }
            }, 1000);

            showMessage(`${teams[currentPlayer].name} TURU`, teams[currentPlayer].color);
        }

        function resetActionButtons() {
            document.getElementById('btn-quiz').classList.remove('hidden');
            document.getElementById('btn-fire').classList.add('hidden');
            document.getElementById('power-container').classList.add('hidden');
            power = 0; isPowering = false;
        }

        function startCharging() {
            if (gameState === "AIMING") {
                gameState = "CHARGING";
                isPowering = true;
                power = 0;
                powerDir = 1.5;
            }
        }
        function stopChargingAndFire() {
            if (gameState !== "CHARGING") return;
            isPowering = false; gameState = "FIRE_ANIM"; AudioSys.playShoot();
            const w = teams[currentPlayer].worms[0];
            const fireX = w.x + Math.cos(w.aimAngle) * 20, fireY = (w.y - 15) + Math.sin(w.aimAngle) * 20;
            projectiles.push(new Projectile(fireX, fireY, w.aimAngle, power / 100));
            document.getElementById('btn-fire').classList.add('hidden');
            document.getElementById('power-container').classList.add('hidden');
        }

        function endTurnDelayed(ms = 2000) {
            if (turnChangePending) return;
            turnChangePending = true;
            clearInterval(turnInterval);
            gameState = "TURN_CHANGE";
            setTimeout(newTurn, ms);
        }

        function checkGameOver() {
            let aliveTeams = teams.filter(t => t.health > 0);

            if (aliveTeams.length === 0) {
                gameState = "GAME_OVER";
                showMessage("BERABERE!", "#ffffff", true);
                showComment('draw');
                showGameOverUI();
                return true;
            } else if (aliveTeams.length === 1 && teams.length > 1) {
                gameState = "GAME_OVER";
                let winner = aliveTeams[0];
                showMessage(`${winner.name} KAZANDI!`, winner.color, true);
                showComment('win');
                showGameOverUI();
                return true;
            }
            return false;
        }

        function showMessage(msg, color, permanent = false) {
            const box = document.getElementById('message-area');
            const txt = document.getElementById('message-text');
            txt.innerText = msg; txt.style.color = color;
            box.classList.remove('hidden');
            if (!permanent) setTimeout(() => box.classList.add('hidden'), 2000);
        }

        function showGameOverUI() {
            document.getElementById('game-over-controls').classList.remove('hidden');
        }

        function loop() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, "#0f172a"); grad.addColorStop(0.5, "#3b82f6"); grad.addColorStop(1, "#93c5fd");
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(width * 0.85, height * 0.15, 60, 0, Math.PI * 2); ctx.fill();

            // Draw Terrain Shape
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, terrainY[0]);
            for (let x = 1; x < width; x += 2) ctx.lineTo(x, terrainY[x]);
            ctx.lineTo(width, terrainY[width - 1]);
            ctx.lineTo(width, height);
            ctx.closePath();

            ctx.fillStyle = "#4a3c31";
            ctx.fill();

            ctx.save();
            ctx.clip();
            let soilGrad = ctx.createLinearGradient(0, 0, 0, height);
            soilGrad.addColorStop(0, "rgba(80, 60, 40, 1)");
            soilGrad.addColorStop(1, "rgba(20, 15, 10, 1)");
            ctx.fillStyle = soilGrad;
            ctx.fill();

            ctx.fillStyle = "rgba(0,0,0,0.4)";
            for (let t of terrainTexture) {
                if (t.y > terrainY[Math.floor(t.x)]) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();

            ctx.lineWidth = 4; ctx.lineCap = "round";
            for (let x = 0; x < width; x += 4) {
                if (terrainY[x] < waterLevel) {
                    ctx.beginPath();
                    ctx.moveTo(x, terrainY[x]);
                    ctx.lineTo(x + 4, terrainY[x + 4]);
                    ctx.strokeStyle = "#8b7355";
                    ctx.stroke();
                }
            }

            ctx.fillStyle = "rgba(20, 50, 80, 0.7)"; ctx.fillRect(0, waterLevel, width, height - waterLevel);
            ctx.fillStyle = "rgba(30, 60, 90, 0.4)"; ctx.beginPath();
            let waveOffset = Date.now() * 0.003;
            ctx.moveTo(0, waterLevel);
            for (let x = 0; x <= width; x += 30) ctx.lineTo(x, waterLevel + Math.sin(x * 0.03 + waveOffset) * 8);
            ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.fill();

            teams.forEach(t => t.worms.forEach(w => { w.update(); w.draw(); }));
            projectiles.forEach((p, i) => { p.update(); p.draw(); if (!p.active) projectiles.splice(i, 1); });
            explosions.forEach((e, i) => {
                e.r += 4; ctx.fillStyle = `rgba(255, 200, 0, ${1 - e.r / e.maxR})`;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
                if (e.r < e.maxR * 0.7) { ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.6, 0, Math.PI * 2); ctx.fill(); }
                if (e.r > e.maxR) explosions.splice(i, 1);
            });
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1; if (p.life <= 0) particles.splice(i, 1);
            });
            floatTexts.forEach((ft, i) => {
                ft.y += ft.vy; ft.life -= 0.02;
                ctx.save(); ctx.font = "bold 20px Fredoka One";
                ctx.fillStyle = `rgba(255, 255, 0, ${ft.life})`; ctx.strokeStyle = `rgba(0, 0, 0, ${ft.life})`; ctx.lineWidth = 3;
                ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore(); if (ft.life <= 0) floatTexts.splice(i, 1);
            });

            if (isPowering) {
                power += powerDir; if (power >= 100 || power <= 0) powerDir *= -1;
                document.getElementById('power-fill').style.width = power + "%";
                if (Math.floor(power) % 5 === 0) AudioSys.playCharge(power);
            }
            requestAnimationFrame(loop);
        }

        function setupControls() {
            const getActiveWorm = () => teams[currentPlayer].worms[0];
            const setupBtn = (id, action) => {
                const el = document.getElementById(id);
                let t = null;
                const start = (e) => {
                    e.preventDefault();
                    if (t) clearInterval(t);
                    if (gameState === "PLAYING" || gameState === "AIMING") {
                        action();
                        t = setInterval(action, 40);
                    }
                }
                const end = (e) => {
                    e.preventDefault();
                    if (t) { clearInterval(t); t = null; }
                }
                el.addEventListener('mousedown', start);
                el.addEventListener('touchstart', start, { passive: false });
                el.addEventListener('mouseup', end);
                el.addEventListener('mouseleave', end);
                el.addEventListener('touchend', end);
                el.addEventListener('touchcancel', end);
            };

            setupBtn('btn-left', () => {
                const w = getActiveWorm();
                w.vx = -1.5;
                w.setFacing(-1);
            });
            setupBtn('btn-right', () => {
                const w = getActiveWorm();
                w.vx = 1.5;
                w.setFacing(1);
            });

            setupBtn('btn-aim-up', () => {
                const w = getActiveWorm();
                if (w.angle === 0) w.aimAngle -= 0.03;
                else w.aimAngle += 0.03;
            });
            setupBtn('btn-aim-down', () => {
                const w = getActiveWorm();
                if (w.angle === 0) w.aimAngle += 0.03;
                else w.aimAngle -= 0.03;
            });

            document.getElementById('btn-jump').addEventListener('click', () => {
                if (gameState === "PLAYING" || gameState === "AIMING") {
                    const w = getActiveWorm();
                    if (w.grounded) {
                        w.vy = -6;
                        w.vx = 4 * (w.angle === 0 ? 1 : -1);
                        AudioSys.playJump();
                    }
                }
            });

            document.getElementById('btn-quiz').addEventListener('click', () => { AudioSys.playTone(300, "sine", 0.1); if (gameState === "PLAYING") { const q = generateQuestion(); renderQuestion(q); gameState = "AIMING"; document.getElementById('math-modal').classList.remove('hidden'); } });
            function renderQuestion(qData) {
                document.getElementById('question-text').innerText = qData.q;
                const grid = document.getElementById('answers-grid'); grid.innerHTML = '';
                qData.options.forEach(opt => {
                    const btn = document.createElement('button'); btn.className = "bg-gray-700 hover:bg-gray-600 text-white p-4 rounded-lg font-mono text-lg transition border border-gray-500 active:scale-95";
                    btn.innerText = opt; btn.onclick = () => {
                        document.getElementById('math-modal').classList.add('hidden');
                        if (opt === qData.a) { gameState = "AIMING"; document.getElementById('btn-quiz').classList.add('hidden'); document.getElementById('btn-fire').classList.remove('hidden'); document.getElementById('power-container').classList.remove('hidden'); showMessage("KİLİT AÇILDI!", "#4ade80"); AudioSys.playTone(600, "sine", 0.1); }
                        else { showMessage("HATALI! SIRA GEÇTİ", "#ef4444"); AudioSys.playTone(200, "sawtooth", 0.3); showComment('miss'); endTurnDelayed(2000); }
                    }; grid.appendChild(btn);
                });
            }
            const fireBtn = document.getElementById('btn-fire');
            fireBtn.addEventListener('mousedown', startCharging); fireBtn.addEventListener('mouseup', stopChargingAndFire);
            fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startCharging(); }); fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopChargingAndFire(); });
        }
        function checkDeaths() { teams.forEach(t => { let total = 0; t.worms.forEach(w => { if (!w.dead) total += w.health; }); t.health = total; }); }
        window.onload = init;
    </script>
